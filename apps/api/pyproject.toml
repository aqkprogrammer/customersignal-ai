[project]
name = "customersignal-api"
version = "1.0.0"
description = "CustomerSignal AI — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "redis>=5.2",
  "arq>=0.26",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2.1",
  "cryptography>=43",
  "httpx>=0.28",
  "anthropic>=0.50",
  "openai>=1.55",
  "stripe>=11.0",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "pyotp>=2.9",
  "numpy>=2.1",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "B904", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
